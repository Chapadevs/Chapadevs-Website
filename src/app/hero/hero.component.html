<section class="hero-section">
  <div class="container">
    <div class="hero-content">
      <!-- Main Headline -->
      <h1 class="title title--hero">
        Your <span class="highlight">Digital Vision</span>,
        <span class="highlight">OUR CODE</span>
      </h1>

      <!-- Subtitle -->
      <p class="text text--lead">
        We turn your <span class="highlight">business ideas</span> into
        <span class="highlight">powerful web applications</span> with
        <span class="highlight">speed</span> and the
        <span class="highlight">control</span> you need.
      </p>

      <!-- Enhanced CTA Buttons -->
      <div class="hero-buttons">
        <button class="btn btn--primary" (click)="scrollToInquiryForm()">
          <span class="btn-text">Start Your Project</span>
          <div class="btn-glow"></div>
        </button>
      </div>
    </div>
  </div>

  <!-- Background Elements -->
  <div class="hero-bg-elements">
    <div class="bg-triangle bg-triangle--1"></div>
    <div class="bg-triangle bg-triangle--2"></div>
    <div class="bg-code">&lt;/&gt;</div>
  </div>
</section>
