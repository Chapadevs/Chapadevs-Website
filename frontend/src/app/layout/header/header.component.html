<header class="main-header">
  <div class="header-content">
    <div class="logo-section">
      <img
        src="assets/logos/chapadevs-logo.png"
        alt="Chapadevs Logo"
        class="header-logo"
      />
      <a 
        href="https://www.linkedin.com/company/chapadevs/" 
        target="_blank" 
        rel="noopener noreferrer"
        class="linkedin-link"
        aria-label="Visit ChaPaDevs LinkedIn page"
      >
        <img
          src="assets/images/linkedin.png"
          alt="LinkedIn"
          class="linkedin-logo"
        />
      </a>
    </div>
    <nav class="header-navigation">
      <button class="header-btn header-btn--faq" (click)="scrollToFaq()">
        FAQ
      </button>
      <button class="header-btn header-btn--inquiry" (click)="scrollToInquiry()">
        INQUIRY
      </button>
    </nav>
  </div>
</header>
